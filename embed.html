<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embeddr Embed</title>
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
            background: #000000;
        }

        #embed-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
            background: #000000;
        }
    </style>
</head>
<body>

    <iframe id="embed-frame"></iframe>

    <!-- UV Dependencies -->
    <script src="uv/uv.bundle.js"></script>
    <script src="uv/uv.config.js"></script>
    <script type="module">
        import { registerSW } from "/prxy/register-sw.mjs";
        import * as BareMux from "/prxy/baremux/index.mjs";

        const connection = new BareMux.BareMuxConnection("/prxy/baremux/worker.js");

        function search(input, template = "https://html.duckduckgo.com/html?t=h_&q=%s") {
            try {
                return new URL(input).toString();
            } catch (err) {}

            try {
                const url = new URL(`http://${input}`);
                if (url.hostname.includes(".")) return url.toString();
            } catch (err) {}

            return template.replace("%s", encodeURIComponent(input));
        }

        async function getUV(input) {
            await registerSW();

            let url = search(input);
            let wispUrl = "wss://wisp.mercurywork.shop";

            if ((await connection.getTransport()) !== "/prxy/epoxy/index.mjs") {
                await connection.setTransport("/prxy/epoxy/index.mjs", [
                    { wisp: wispUrl },
                ]);
            }

            return __uv$config.prefix + __uv$config.encodeUrl(url);
        }

        function getUrlFromQueryParam() {
            const params = new URLSearchParams(window.location.search);
            return params.get('url');
        }

        async function embedUrl() {
            const url = getUrlFromQueryParam();
            const iframe = document.getElementById('embed-frame');

            if (!url) return;

            try {
                const proxiedUrl = await getUV(url);
                iframe.src = proxiedUrl;
                document.title = `Embeddr Embed: ${url}`;
            } catch (error) {
                console.error("Failed to load proxied site:", error);
            }
        }

        // Initialize immediately
        if (typeof __uv$config !== 'undefined') {
            embedUrl();
        } else {
            const checkConfig = setInterval(() => {
                if (typeof __uv$config !== 'undefined') {
                    clearInterval(checkConfig);
                    embedUrl();
                }
            }, 10);
        }
    </script>
</body>
</html>
