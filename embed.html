<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embeddr Embed</title>
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
            background: #000000;
        }

        #embed-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
            background: #000000;
        }
    </style>
</head>
<body>

    <iframe id="embed-frame"></iframe>

    <!-- UV Dependencies -->
    <script src="uv/uv.bundle.js"></script>
    <script src="uv/uv.config.js"></script>
    <script>
      // Ensure UV Service Worker is registered
      async function initUV() {
        if ("serviceWorker" in navigator) {
          return navigator.serviceWorker.register(__uv$config.sw, {
            scope: __uv$config.prefix
          });
        }
        throw new Error("Service Workers are not supported in this environment.");
      }

      window.addEventListener("message", async (event) => {
        if (event.data?.type !== "START_LINK_CHECK") return;

        const { target, filters, requestId } = event.data;
        const targetApi = `https://noc.exploits-bg.com/api/linkcheck/stream?url=${encodeURIComponent(target)}&filters=${encodeURIComponent(filters)}`;

        try {
          // Register SW if not already active
          await initUV();
          await navigator.serviceWorker.ready;

          // Route request through UV's prefix and encoder
          const proxiedUrl = __uv$config.prefix + __uv$config.encodeUrl(targetApi);

          const response = await fetch(proxiedUrl, {
            headers: { Accept: "text/event-stream" },
            cache: "no-store"
          });

          if (!response.ok || !response.body) {
            event.source.postMessage({ type: "LINK_CHECK_ERROR", requestId, error: `Stream failed with status ${response.status}` }, event.origin);
            return;
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const chunk = await reader.read();
            buffer += decoder.decode(chunk.value || new Uint8Array(), { stream: !chunk.done });
            const events = buffer.split("\n\n");
            buffer = events.pop() || "";

            events.forEach((evt) => {
              const dataLine = evt.split("\n").find((line) => line.startsWith("data: "));
              if (!dataLine) return;
              try {
                const data = JSON.parse(dataLine.slice(6));
                event.source.postMessage({ type: "LINK_CHECK_RESULT", requestId, data }, event.origin);
              } catch (_) {}
            });

            if (chunk.done) break;
          }

          event.source.postMessage({ type: "LINK_CHECK_DONE", requestId }, event.origin);

        } catch (err) {
          event.source.postMessage({ type: "LINK_CHECK_ERROR", requestId, error: err.message }, event.origin);
        }
      });
    </script>
</body>
</html>
